:root {
  --text: #1f2328;
  --muted: #6b6375;
  --bg: #ffffff;
  --border: #e5e4e7;
  --code-bg: #f4f3ec;

  /* 代码高亮配色（highlight.js 的 token 类名） */
  --hl-comment: #a0a1a7;
  --hl-keyword: #a626a4;
  --hl-string: #50a14f;
  --hl-number: #986801;
  --hl-function: #4078f2;
  --hl-type: #c18401;
  --hl-variable: #e45649;

  font-family: system-ui, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  font-size: 16px;
  line-height: 1.65;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}

@media (prefers-color-scheme: dark) {
  :root {
    --text: #e6e6ea;
    --muted: #9ca3af;
    --bg: #16171d;
    --border: #2e303a;
    --code-bg: #1f2028;
    --surface: #1b1d24;
    --link: #c084fc;

    --hl-function: #61afef;
    --hl-type: #e5c07b;
    --hl-variable: #e06c75;
  }
}

* {

}

body {

   这里只有「让渲染结果好读」的样式，跟 markdown 的解析逻辑无关。
   颜色统一走 index.css 里的 CSS 变量，所以深浅色主题自动适配。
   ========================================================================== */

/* 顶栏：加载按钮 + 当前文件路径 */
.toolbar {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 10px 20px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
}

.btn {
  padding: 6px 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg);
  color: var(--text);
  font: inherit;
  font-size: 14px;
  cursor: pointer;
  white-space: nowrap;
}

.btn:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.file-path {
  font-family: ui-monospace, Menlo, Consolas, monospace;
  font-size: 13px;
  color: var(--muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}

.empty {
  margin-top: 12vh;
  text-align: center;
}

.empty-title {
  margin: 0 0 6px;
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
}

.empty-hint {
  margin: 0;
  font-size: 13px;
  color: var(--muted);
}

.page {
  max-width: 820px;
  margin: 0 auto;
  padding: 40px 24px 96px;
}

/* 标题 */
.page h1,
.page h2,
.page h3,
.page h4,
.page h5,
.page h6 {
  margin: 1.6em 0 0.6em;
  line-height: 1.3;
}

.page h1 {
  font-size: 1.9em;
}

.page h2 {
  font-size: 1.5em;
}

.page h3 {
  font-size: 1.2em;
}

/* 段落、列表、引用、代码块之间的间距 */
.page p,
.page ul,
.page ol,
.page blockquote,
.page pre {
  margin: 0 0 1em;
}

.page ul,
.page ol {
  padding-left: 1.5em;
}

.page a {
  color: var(--link);
}

.page blockquote {
  margin-inline: 0;
  padding-left: 1em;
  border-left: 3px solid var(--border);
  color: var(--muted);
}

.page blockquote > :last-child {
  margin-bottom: 0;
}

/* 行内代码与代码块 */
.page code {
  padding: 0.15em 0.4em;
  border-radius: 4px;
  background: var(--code-bg);
  font-family: ui-monospace, Menlo, Consolas, monospace;
  font-size: 0.9em;
}

.page pre {
  padding: 14px 16px;
  border-radius: 8px;
  background: var(--code-bg);
  overflow-x: auto;
}

.page pre code {
  padding: 0;
  background: none;
  font-size: 0.875em;
}

.page img {
  max-width: 100%;
}

.page hr {
  margin: 2em 0;
  border: 0;
  border-top: 1px solid var(--border);
}

/* ---------- 下面这几块样式，对应各自插件的输出 ---------- */

/* remark-gfm：表格 */
.page table {
  margin: 0 0 1em;
  border-collapse: collapse;
  font-size: 0.95em;
}

.page th,
.page td {
  padding: 6px 12px;
  border: 1px solid var(--border);
}

.page th {
  background: var(--code-bg);
  text-align: left;
}

.page tbody tr:nth-child(2n) {
  background: var(--surface);
}

/* remark-gfm：任务列表（- [ ] 渲染成 <ul class="contains-task-list">） */
.page .contains-task-list {
  padding-left: 0.2em;
  list-style: none;
}

.page .task-list-item > input[type='checkbox'] {
  margin-right: 0.5em;
  vertical-align: -0.15em;
  accent-color: var(--accent);
}

/* remark-gfm：脚注区 */
.page .footnotes {
  margin-top: 2.5em;
  padding-top: 1em;
  border-top: 1px solid var(--border);
  font-size: 0.9em;
  color: var(--muted);
}

.page .footnotes h2 {
  font-size: 1em;
  border: 0;
}

.page [data-footnote-ref] {
  padding: 0 0.15em;
  font-weight: 600;
}

/* rehype-raw：文档里的原生 HTML 标签 */
.page details {
  margin-bottom: 1em;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface);
}

.page summary {
  cursor: pointer;
  font-weight: 600;
}

.page details[open] summary {
  margin-bottom: 0.6em;
}

.page mark {
  padding: 0.1em 0.25em;
  border-radius: 3px;
  background: var(--accent-bg);
  color: var(--text);
}

.page kbd {
  padding: 0.15em 0.45em;
  border: 1px solid var(--border);
  border-bottom-width: 2px;
  border-radius: 4px;
  font-family: ui-monospace, Menlo, Consolas, monospace;
  font-size: 0.85em;
}

/* rehype-highlight：代码高亮 token 配色（颜色值见 index.css 的 --hl-* 变量） */
.hljs {
  color: var(--text);
}

.hljs-comment,
.hljs-quote,
.hljs-meta {
  color: var(--hl-comment);
  font-style: italic;
}

.hljs-keyword,
.hljs-selector-tag,
.hljs-doctag {
  color: var(--hl-keyword);
}

.hljs-string,
.hljs-regexp,
.hljs-addition,
.hljs-char.escape {
  color: var(--hl-string);
}

.hljs-number,
.hljs-literal,
.hljs-attr,
.hljs-variable.constant {
  color: var(--hl-number);
}

.hljs-title,
.hljs-title.function_,
.hljs-section,
.hljs-name {
  color: var(--hl-function);
}

.hljs-title.class_,
.hljs-type,
.hljs-built_in,
.hljs-symbol,
.hljs-bullet {
  color: var(--hl-type);
}

.hljs-variable,
.hljs-template-variable,
.hljs-tag,
.hljs-deletion {
  color: var(--hl-variable);
}

.hljs-property,
.hljs-params,
.hljs-operator,
.hljs-punctuation,
.hljs-subst {
  color: var(--text);
}

.hljs-emphasis {
  font-style: italic;
}

.hljs-strong {
  font-weight: 600;
}

/* rehype-katex：公式，超宽时横向滚动 */
.page .katex {
  font-size: 1.05em;
}

.page .katex-display {
  margin: 1em 0;
  padding: 2px 0;
  overflow-x: auto;
  overflow-y: hidden;
}
